<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Palabritas · Tu Vocabulario</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  /* Noche de Plaza — midnight indigo, hibiscus coral, marigold */
  --bg:#110D24;--bg2:#181234;--bg3:#201848;
  --card:rgba(38,28,74,0.62);--card2:rgba(54,40,100,0.46);--card3:rgba(70,52,124,0.42);
  --border:rgba(255,176,138,0.16);--border-hi:rgba(255,160,130,0.62);
  --brand:#FF8A78;--brandL:#FFB3A2;--brandD:#C6432E;
  --sun:#F6C85F;--sunL:#FFE29A;--azul:#6FB7E9;
  --sand:#F7ECDF;--muted:#B8AACF;--muted2:#7F7399;
  --accent:#F6C85F;--green:#6FD6A0;--red:#FF7B8A;--blue:#79BDF0;--purple:#BDA2F5;
  --l1:#FF7B7B;--l2:#FF9F5A;--l3:#F6C85F;--l4:#6FB7E9;--l5:#B79CF0;--lm:#6FD6A0;
  --serif:'Fraunces',Georgia,serif;
  --shadow:0 14px 40px rgba(4,2,16,.45);
}
html{-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--sand);font-family:'Nunito Sans',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
input,select,textarea,button{font-family:inherit;}
input::placeholder,textarea::placeholder{color:var(--muted2);}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:rgba(255,176,138,.3);border-radius:2px;}
select option{background:#241A4C;color:var(--sand);}
.atmo{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 40% at 12% 8%,rgba(255,138,120,0.14) 0%,transparent 70%),
    radial-gradient(ellipse 55% 55% at 90% 88%,rgba(111,183,233,0.10) 0%,transparent 70%),
    radial-gradient(ellipse 40% 30% at 70% 20%,rgba(246,200,95,0.06) 0%,transparent 70%);}
/* azulejo tile pattern */
.atmo::after{content:'';position:absolute;inset:0;opacity:.55;
  background-image:
    radial-gradient(circle at 50% 50%,transparent 0,transparent 5px,rgba(255,200,170,0.07) 5.5px,rgba(255,200,170,0.07) 6.5px,transparent 7px),
    radial-gradient(circle at 0 0,rgba(255,200,170,0.05) 0,rgba(255,200,170,0.05) 3px,transparent 3.5px),
    radial-gradient(circle at 100% 100%,rgba(255,200,170,0.05) 0,rgba(255,200,170,0.05) 3px,transparent 3.5px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse at 50% 30%,black 10%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%,black 10%,transparent 75%);}
.shell{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 18px 90px;}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:20px 0 16px;border-bottom:1px solid var(--border);margin-bottom:24px;}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.brand-es{font-family:'Dancing Script',cursive;font-size:32px;line-height:1;color:var(--brandL);text-shadow:0 2px 18px rgba(255,138,120,.35);}
.brand-sub{font-size:9px;color:var(--muted);letter-spacing:.24em;text-transform:uppercase;margin-top:3px;}
.nav-btns{display:flex;gap:2px;background:rgba(0,0,0,.18);border:1px solid var(--border);border-radius:11px;padding:3px;}
.nav-btn{padding:6px 11px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.03em;background:transparent;color:var(--muted);transition:all .2s;}
.nav-btn:hover{color:var(--sand);}
.nav-btn.active{background:linear-gradient(135deg,rgba(255,138,120,.22),rgba(246,200,95,.12));color:var(--sunL);border-color:rgba(255,160,130,.3);}
.inp{width:100%;background:rgba(255,255,255,0.045);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--sand);font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s;}
.inp:focus{border-color:var(--border-hi);box-shadow:0 0 0 3px rgba(255,138,120,.14);}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px;}
.field{margin-bottom:18px;}
.btn1{background:linear-gradient(135deg,#E2543D,#FF8A78 55%,#F6A65F);color:#2A0F0A;border:none;border-radius:12px;padding:13px 26px;font-size:14px;cursor:pointer;font-weight:800;letter-spacing:.04em;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 26px rgba(255,110,90,0.32),inset 0 1px 0 rgba(255,255,255,.3);transition:all .2s;}
.btn1:hover{filter:brightness(1.07);transform:translateY(-1px);}
.btn1:active{transform:translateY(0);}
.btn1:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;filter:none;}
.btn2{background:transparent;color:var(--brandL);border:1px solid rgba(255,160,130,0.4);border-radius:12px;padding:11px 22px;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:all .2s;}
.btn2:hover{border-color:var(--brand);background:rgba(255,138,120,0.09);}
.btn3{background:rgba(255,255,255,0.06);color:var(--sand);border:1px solid var(--border);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.btn3:hover{background:rgba(255,255,255,0.11);}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow);}
.s-head{font-size:10px;font-weight:800;color:var(--sun);letter-spacing:.2em;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.s-head-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(246,200,95,0.32),transparent);}
.prog-bar{height:4px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;transition:width .4s ease;background:linear-gradient(90deg,var(--brand),var(--sun));}
.flip-wrap{perspective:1400px;height:340px;margin-bottom:20px;cursor:pointer;}
.flip-inner{transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1);height:100%;position:relative;}
.flip-inner.flipped{transform:rotateY(180deg);cursor:default;}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:linear-gradient(160deg,rgba(52,38,98,.92),rgba(30,22,62,.92));border:1px solid var(--border);border-radius:22px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow);overflow:hidden;}
/* tile corner flourish */
.flip-face::after{content:'';position:absolute;inset:10px;border:1px solid rgba(255,176,138,.12);border-radius:15px;pointer-events:none;}
.flip-back{transform:rotateY(180deg);background:linear-gradient(150deg,rgba(66,46,112,.95),rgba(34,24,70,.95));border-color:rgba(246,200,95,0.3);overflow-y:auto;justify-content:flex-start;padding-top:24px;}
.flip-face::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:3px;border-radius:0 0 40px 40px;background:linear-gradient(90deg,transparent,rgba(255,138,120,0.7),rgba(246,200,95,.7),transparent);}
.rating-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.rate-btn{border-radius:14px;padding:15px 5px;cursor:pointer;text-align:center;border:1px solid;transition:all .15s;font-weight:800;font-family:inherit;font-size:15px;letter-spacing:.03em;}
.rate-btn:hover{transform:translateY(-2px);}
.modal-overlay{position:fixed;inset:0;background:rgba(6,3,20,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.modal{background:linear-gradient(160deg,#2A1F58,#1C1442);border:1px solid rgba(255,176,138,0.24);border-radius:22px;padding:30px;max-width:460px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.55);}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;background:#2A1F58;border-radius:12px;padding:10px 20px;font-size:13px;font-weight:700;letter-spacing:.03em;white-space:nowrap;box-shadow:0 10px 34px rgba(0,0,0,.5);opacity:0;transition:opacity .3s;pointer-events:none;border:1px solid var(--border);}
.toast.show{opacity:1;}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block;letter-spacing:.04em;}
.tab-strip{display:flex;gap:5px;margin-bottom:22px;overflow-x:auto;padding-bottom:4px;}
.tab-strip::-webkit-scrollbar{height:2px;}
.tab-btn{flex-shrink:0;border-radius:10px;border:1px solid var(--border);padding:6px 14px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);background:transparent;transition:all .2s;white-space:nowrap;}
.tab-btn:hover{color:var(--sand);}
.word-row{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 15px;display:flex;align-items:center;gap:13px;margin-bottom:7px;transition:border-color .2s,transform .15s;}
.word-row:hover{border-color:rgba(255,160,130,0.38);transform:translateX(2px);}
.box-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;}
.box-card{border-radius:16px;padding:15px 11px;cursor:pointer;transition:all .15s;text-align:center;border:1.5px solid var(--border);background:var(--card);box-shadow:0 6px 18px rgba(4,2,16,.28);}
.box-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(4,2,16,.4);}
.box-card.queue-box{border-style:dashed;opacity:.72;padding:10px 9px;cursor:default;box-shadow:none;}
.box-card.queue-box:hover{transform:none;box-shadow:none;}
.box-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;font-weight:800;}
.box-count{font-family:var(--serif);font-size:32px;font-weight:700;line-height:1;}
.queue-label{font-size:8px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;font-weight:800;opacity:.85;}
.queue-count{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1;}
.step-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border);}
.step-row:last-child{border-bottom:none;}
.step-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}
.step-toggle{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--sand);flex-shrink:0;transition:all .2s;}
.step-toggle.on{background:rgba(255,138,120,0.2);border-color:var(--brand);color:var(--brandL);}
.step-toggle.off{color:var(--muted2);}
.prompt-banner{background:linear-gradient(150deg,rgba(255,138,120,0.12),rgba(246,200,95,0.06));border:1px solid rgba(255,160,130,0.34);border-radius:18px;padding:26px 20px;margin-bottom:18px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 6px;text-align:center;}
.stat-box > div:first-child{font-family:var(--serif);}
.variant-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.variant-pill{border-radius:20px;border:1px solid var(--border);padding:5px 13px;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);background:transparent;transition:all .2s;letter-spacing:.03em;}
.variant-pill:hover{color:var(--sand);}
.variant-pill.active{background:rgba(255,138,120,0.2);border-color:rgba(255,160,130,0.5);color:var(--sunL);}
.ornament{text-align:center;color:rgba(246,200,95,0.4);font-size:18px;margin:22px 0;letter-spacing:10px;}
.end-btn{background:rgba(255,123,138,0.08);border:1px solid rgba(255,123,138,0.28);color:var(--red);border-radius:9px;cursor:pointer;font-size:12px;font-weight:700;padding:5px 14px;letter-spacing:.04em;transition:all .2s;}
.end-btn:hover{background:rgba(255,123,138,0.16);}
.sub-tab-strip{display:flex;gap:0;margin-bottom:24px;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.sub-tab-btn{flex:1;padding:10px 6px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);background:transparent;border:none;border-right:1px solid var(--border);letter-spacing:.04em;transition:all .2s;text-align:center;}
.sub-tab-btn:last-child{border-right:none;}
.sub-tab-btn:hover{color:var(--sand);background:rgba(255,255,255,0.04);}
.sub-tab-btn.active{background:rgba(255,138,120,0.18);color:var(--sunL);font-weight:800;}
.preview-field{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.preview-es{font-family:var(--serif);font-size:22px;color:var(--brandL);font-weight:600;}
.preview-label{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,160,130,0.25);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.bulk-ta{width:100%;background:rgba(255,255,255,0.045);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--sand);font-size:14px;outline:none;resize:vertical;min-height:160px;line-height:1.8;transition:border-color .2s,box-shadow .2s;}
.bulk-ta:focus{border-color:var(--border-hi);box-shadow:0 0 0 3px rgba(255,138,120,.14);}
.bulk-result{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;margin-bottom:5px;font-size:13px;}
.bulk-result.ok{background:rgba(111,214,160,0.09);border:1px solid rgba(111,214,160,0.22);}
.bulk-result.err{background:rgba(255,123,138,0.08);border:1px solid rgba(255,123,138,0.2);color:var(--muted);}
@media(max-width:480px){.box-grid,.stat-grid{grid-template-columns:1fr 1fr;}.reserve-panel{grid-column:1 / -1;grid-row:auto;}.rating-grid{grid-template-columns:1fr 1fr;}.brand-es{font-size:28px;}.nav-btn{padding:6px 8px;font-size:11px;}}
.reserve-panel{grid-column:3;grid-row:1 / span 5;display:flex;flex-direction:column;gap:10px;}
.reserve-ctl{border:1.5px solid rgba(216,195,165,0.28);border-radius:16px;padding:14px 13px;background:rgba(216,195,165,0.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:relative;}
.reserve-ctl .inp{padding:8px 10px;font-size:14px;}
.reserve-row{display:flex;gap:8px;align-items:center;}
.reserve-star{background:none;border:none;cursor:pointer;font-size:19px;line-height:1;padding:3px 6px;color:rgba(255,255,255,0.28);transition:color .15s;}
.reserve-star.on{color:var(--sun);}
.vessel{display:block;margin:0 auto 8px;filter:drop-shadow(0 4px 10px rgba(255,138,120,.25));}
.vessel.full{filter:drop-shadow(0 0 12px rgba(246,200,95,.55));}
.card-back-word{font-family:var(--serif);font-size:38px;font-weight:700;color:var(--brandL);text-align:center;margin-bottom:6px;}
.card-back-english{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--sand);text-align:center;margin-bottom:10px;}
.card-back-example{font-family:var(--serif);font-size:18px;color:var(--sunL);text-align:center;line-height:1.6;margin-bottom:6px;font-style:italic;}
.card-back-example-en{font-size:13px;color:var(--muted);text-align:center;line-height:1.5;margin-bottom:12px;}
.card-back-forms{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px;}
.card-back-form{text-align:center;background:rgba(255,138,120,0.11);border:1px solid rgba(255,160,130,.16);border-radius:10px;padding:7px 12px;}
.card-back-form-label{font-size:8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px;}
.card-back-form-val{font-family:var(--serif);font-size:15px;color:var(--brandL);font-weight:600;}
.apply-mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
.apply-mode-btn{border-radius:16px;padding:18px 14px;cursor:pointer;text-align:center;border:1.5px solid var(--border);background:var(--card);transition:all .2s;}
.apply-mode-btn:hover{border-color:rgba(255,160,130,0.45);transform:translateY(-2px);}
.apply-mode-btn.active{background:rgba(255,138,120,0.14);border-color:rgba(255,160,130,0.6);}
.apply-mode-icon{font-size:26px;margin-bottom:8px;}
.apply-mode-label{font-size:13px;font-weight:800;color:var(--sand);margin-bottom:4px;}
.apply-mode-desc{font-size:11px;color:var(--muted);line-height:1.4;}
.apply-text-wrap{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px 20px;margin-bottom:16px;}
.apply-text{font-family:var(--serif);font-size:20px;line-height:2.1;color:var(--sand);}
.apply-text-en{font-size:14px;color:var(--muted);line-height:1.8;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.w-known{color:var(--sunL);cursor:default;}
.w-new{color:var(--azul);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px;cursor:pointer;position:relative;}
.w-new:hover .w-tooltip{display:block;}
.w-tooltip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#2A1F58;border:1px solid rgba(111,183,233,0.4);border-radius:12px;padding:10px 14px;min-width:180px;max-width:240px;z-index:50;box-shadow:0 14px 34px rgba(0,0,0,.5);text-align:center;font-family:'Nunito Sans',sans-serif;}
.w-tooltip-meaning{font-size:14px;color:var(--sand);margin-bottom:8px;}
.w-tooltip-btns{display:flex;gap:6px;justify-content:center;}
.w-tooltip-btn{font-size:10px;font-weight:700;padding:4px 10px;border-radius:7px;border:1px solid;cursor:pointer;font-family:inherit;letter-spacing:.04em;white-space:nowrap;}
.grammar-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:18px;}
.grammar-btn{border-radius:11px;padding:9px 10px;cursor:pointer;text-align:center;border:1px solid var(--border);background:transparent;font-size:12px;font-weight:600;color:var(--muted);transition:all .2s;line-height:1.3;}
.grammar-btn:hover{color:var(--sand);border-color:rgba(255,160,130,0.35);}
.grammar-btn.active{background:rgba(255,138,120,0.16);border-color:rgba(255,160,130,0.55);color:var(--sunL);font-weight:800;}
.sentence-row{background:var(--card2);border:1px solid var(--border);border-radius:13px;padding:14px 16px;margin-bottom:10px;}
.sentence-es{font-family:var(--serif);font-size:19px;color:var(--sand);line-height:1.7;margin-bottom:6px;}
.sentence-en{font-size:13px;color:var(--muted);line-height:1.5;}

/* ── Home hero: sky changes with the hour ── */
.hero-wrap{position:relative;border-radius:24px;overflow:hidden;margin-bottom:18px;border:1px solid var(--border);box-shadow:var(--shadow);min-height:176px;}
.hero-sky{position:absolute;inset:0;}
.hero-svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%;display:block;}
.hero-copy{position:relative;z-index:2;padding:22px 22px 0;text-shadow:0 2px 14px rgba(0,0,0,.35);}
.hero-hi{font-family:'Dancing Script',cursive;font-size:36px;line-height:1.05;color:#fff;}
.hero-sub{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.82);margin-top:6px;}
.hero-chip{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:rgba(10,6,30,.42);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;color:#fff;text-shadow:none;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>
<div class="atmo"></div>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>
<div class="shell">
  <nav>
    <div class="brand" onclick="goHome()">
      <div>
        <div class="brand-es">🌺 Palabritas</div>
        <div class="brand-sub">tu vocabulario</div>
      </div>
    </div>
    <div class="nav-btns">
      <button class="nav-btn active" id="nb-home"  onclick="setView('home')">Home</button>
      <button class="nav-btn"        id="nb-boxes" onclick="setView('boxes')">Boxes</button>
      <button class="nav-btn"        id="nb-add"   onclick="setView('add')">Add</button>
      <button class="nav-btn"        id="nb-apply" onclick="setView('apply')">Practice</button>

</div>
<script>
// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const WORD_TYPES=["Noun","Verb","Adjective","Adverb","Phrase","Preposition","Conjunction","Other"];
const VARIANTS=["Neutral","Mexico","Argentina","Spain","Colombia","Caribbean","Chile","Other"];
const VARIANT_NOTES={
  Neutral:"Neutral / Standard Spanish",
  Mexico:"Mexican Spanish",
  Argentina:"Argentine / Rioplatense Spanish",

  Other:"Spanish"
};
const DAY_NAMES=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const BOXES=[
  {id:"l1q",label:"L1 Queue",color:"#FF7B7B",isQueue:true,main:1},
  {id:"l1",label:"Level 1",color:"#FF7B7B",isQueue:false,main:1},

  {id:"l3",label:"Level 3",color:"#F6C85F",isQueue:false,main:3},
  {id:"l4q",label:"L4 Queue",color:"#6FB7E9",isQueue:true,main:4},
  {id:"l4",label:"Level 4",color:"#6FB7E9",isQueue:false,main:4},
  {id:"l5a",label:"L5A",color:"#B79CF0",isQueue:false,main:5},
  {id:"l5b",label:"L5B",color:"#B79CF0",isQueue:false,main:5},
  {id:"mastered",label:"Mastered",color:"#6FD6A0",isQueue:false,main:6},
  {id:"reserve",label:"Reserves",color:"#D8C3A5",isQueue:false,main:7},
];
const DAY_LEVELS={
  0:["l5b","l4","l3","l2b","l1"],1:["l2b","l1"],2:["l2b","l1"],

const SESSION_QUEUE_FOR_BOX={l1:"l1q",l1q:"l1q",l2a:"l2a",l2b:"l2a",l3:"l3q",l3q:"l3q",l4:"l4q",l4q:"l4q",l5a:"l5a",l5b:"l5a",mastered:"mastered"};

const WORKER_URL="https://palabritas-worker.justin-andre00.workers.dev";
let _pin=""; // loaded from localStorage on boot

// ═══════════════════════════════════════════════════════════
// STORAGE — PIN-prefixed localStorage + Cloudflare KV sync
// ═══════════════════════════════════════════════════════════
function pinKey(k){return _pin?`${_pin}-${k}`:k;}
function ls(k,d){try{const v=localStorage.getItem(pinKey(k));return v!==null?JSON.parse(v):d;}catch{return d;}}
function ss(k,v){
  try{localStorage.setItem(pinKey(k),JSON.stringify(v));}catch{}
  if(_pin)kvSet(pinKey(k),v); // fire-and-forget KV sync
}
function getWords(){return ls("pal-words",[]);}
function saveWords(w){ss("pal-words",w);}
function getBoxes(){return ls("pal-boxes",{l1:[],l1q:[],l2a:[],l2b:[],l3q:[],l3:[],l4q:[],l4:[],l5a:[],l5b:[],mastered:[],reserve:[]});}
function saveBoxes(b){ss("pal-boxes",b);}
function getSettings(){return ls("pal-settings",{l1Target:40});}
function saveSettings(s){ss("pal-settings",s);}
function getStats(){return ls("pal-stats",{sessions:[],lifetime:{reviewed:0,correct:0,byLevel:{}}});}
function saveStats(s){ss("pal-stats",s);}
function getSession(){return ls("pal-session",null);}
function saveSession(s){ss("pal-session",s);}
function clearSession(){localStorage.removeItem(pinKey("pal-session"));}
// ── PIN & API key (device-local, no PIN prefix) ──
function getPin(){try{return localStorage.getItem("pal-pin")||"";}catch{return "";}}
function savePin(p){try{localStorage.setItem("pal-pin",p);}catch{}}
function getApiKey(){try{return localStorage.getItem("pal-api-key")||"";}catch{return "";}}
function saveApiKey(k){try{localStorage.setItem("pal-api-key",k);}catch{}}
// ── Cloudflare KV helpers ──
async function kvSet(key,val){
  if(!_pin||insideClaude())return;
  try{
    await fetch(WORKER_URL,{method:"POST",
      headers:{"Content-Type":"application/json","X-Action":"kv-set"},
      body:JSON.stringify({key,value:JSON.stringify(val)})});
  }catch(e){/* silent — localStorage is fine locally */}
}
async function kvGetAll(pin){
  const r=await fetch(WORKER_URL,{method:"POST",
    headers:{"Content-Type":"application/json","X-Action":"kv-getall","X-Pin":pin},
    body:"{}"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return await r.json();
}

// ═══════════════════════════════════════════════════════════
// MIDNIGHT QUEUE CLEAR
// ═══════════════════════════════════════════════════════════
function runMidnightClear(){
  const key=pinKey("pal-last-clear");
  const today=new Date().toDateString();
  if(ls(key,null)===today)return;
  const sess=getSession();
  if(sess&&sess.active)return;
  const boxes=getBoxes();let changed=false;
  [["l1q","l1"],["l3q","l3"],["l4q","l4"]].forEach(([from,to])=>{
    const ids=boxes[from]||[];
    if(ids.length){boxes[to]=[...(boxes[to]||[]),...ids];boxes[from]=[];changed=true;}
  });
  if(changed)saveBoxes(boxes);
  ss(key,today);
}

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function uid(){return`w${Date.now()}${Math.random().toString(36).slice(2,5)}`;}
function todayDow(){return new Date().getDay();}
function hexRgb(hex){const h=hex.replace("#","");return`${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)}`;}
function sHead(t){return`<div class="s-head">${t}<div class="s-head-line"></div></div>`;}
function wordById(id){return getWords().find(w=>w.id===id);}
function boxDef(id){return BOXES.find(b=>b.id===id)||{id,label:id,color:"#888",isQueue:false,main:1};}
function moveWords(ids,fromBox,toBox){const b=getBoxes();const set=new Set(ids);b[fromBox]=(b[fromBox]||[]).filter(id=>!set.has(id));b[toBox]=[...(b[toBox]||[]),...ids];saveBoxes(b);}
function addWordToBox(wordId,box){const b=getBoxes();if(!b[box])b[box]=[];if(!b[box].includes(wordId))b[box].push(wordId);saveBoxes(b);}
function removeWordFromBox(wordId,box){const b=getBoxes();b[box]=(b[box]||[]).filter(id=>id!==wordId);saveBoxes(b);}
let _toastT;
function toast(msg,col){col=col||"var(--green)";clearTimeout(_toastT);const el=document.getElementById("toast");el.textContent=msg;el.style.borderColor=col;el.style.color=col;el.classList.add("show");_toastT=setTimeout(()=>el.classList.remove("show"),2800);}
function sessionDoneToday(){const stats=getStats();const today=new Date().toDateString();return stats.sessions.some(s=>new Date(s.ts).toDateString()===today);}
function variantNote(d){return VARIANT_NOTES[d]||d;}

// ═══════════════════════════════════════════════════════════
// ROUTING
// ═══════════════════════════════════════════════════════════
function correctDest(box,dow){
  if(box==="l5b")return"mastered";if(box==="l4")return"l5a";if(box==="l3")return"l4";
  if(box==="l2b")return L3Q_DAYS.includes(dow)?"l3q":"l3";if(box==="l1")return"l2a";return"l1";
}
function incorrectDest(box){
  if(box==="l5b")return"l4q";if(box==="l4")return"l3q";if(box==="l3")return"l2a";
  if(box==="l2b")return"l1q";if(box==="l1")return"l1q";return"l1q";
}
let _view="home";
function setView(v){
  _view=v;
  ["home","boxes","add","apply","stats"].forEach(k=>{

function goHome(){setView("home");}
function render(){
  const m=document.getElementById("main");if(!m)return;
  if(_view==="home")m.innerHTML=renderHome();
  else if(_view==="boxes")m.innerHTML=renderBoxes();
  else if(_view==="add")m.innerHTML=renderAdd();
  else if(_view==="apply")m.innerHTML=renderApply();

  else if(_view==="review")m.innerHTML=renderReview();

// ═══════════════════════════════════════════════════════════
// HOME
// ═══════════════════════════════════════════════════════════
let _variantFilter="All";
function heroHtml(total,due){
  const h=new Date().getHours();

  else if(h>=12&&h<18){hi="¡Buenas tardes!";sky="linear-gradient(180deg,#2F86D9 0%,#6FB7E9 60%,#FFE0A8 100%)";orb="#FFF1B8";orbX=440;roof="#8C3A2A";far="#C0674E";}
  else if(h>=18&&h<21){hi="¡Buenas tardes!";sky="linear-gradient(180deg,#3B2A7A 0%,#C8456B 52%,#FF9A5A 100%)";orb="#FFB36B";orbX=560;roof="#411A3A";far="#7A2F55";}

      <path d="M0 176V122l36-12 36 12v10h28v-30l30-14 30 14v30h40v-38h24v-12h30v12h24v38h54v-26l34-16 34 16v26h46v-34h26v-14h26v14h26v34h60v-22l32-14 32 14v22h40v-30l30-14 30 14v30h46V176z" fill="${far}" opacity=".85"/>
      <path d="M0 176v-30h42v-18l30-16 30 16v18h38c0-22 16-34 34-34s34 12 34 34h44v-24h60l26-18 26 18h44c0-24 18-38 38-38s38 14 38 38h36v-14l34-16 34 16v14h42v-26l28-14 28 14v26h38V176z" fill="${roof}"/>
      <g fill="${night?"#FFD58A":"#FFE9B8"}" opacity="${night?".95":".55"}"><rect x="62" y="150" width="9" height="13" rx="4"/><rect x="214" y="146" width="9" height="14" rx="4"/><rect x="356" y="152" width="9" height="12" rx="4"/><rect x="498" y="148" width="9" height="14" rx="4"/><rect x="618" y="146" width="9" height="14" rx="4"/></g>

function renderHome(){
  const boxes=getBoxes();const words=getWords();const dow=todayDow();const sess=getSession();
  const pills=["All",...VARIANTS].map(d=>`<button class="variant-pill${_variantFilter===d?" active":""}" onclick="_variantFilter='${d}';setView('home')">${d}</button>`).join("");

    ctaHtml=`<div class="card" style="margin-bottom:14px;text-align:center">

    ctaHtml=`<div class="card" style="margin-bottom:14px;text-align:center;padding:36px 24px">

function renderBoxGrid(){
  const boxes=getBoxes();const words=getWords();
  const dm={};words.forEach(w=>{dm[w.id]=w.dialect;});
  function cnt(id){const ids=boxes[id]||[];return _variantFilter==="All"?ids.length:ids.filter(id=>dm[id]===_variantFilter).length;}
  const layout=[{id:"l1q",q:true},{id:"l1",q:false},{id:"l2a",q:false},{id:"l2b",q:false},{id:"l3q",q:true},{id:"l3",q:false},{id:"l4q",q:true},{id:"l4",q:false},{id:"l5a",q:false},{id:"l5b",q:false}];
  let h=`<div class="box-grid">`;
  for(const item of layout){
    const def=boxDef(item.id);const c=def.color;const rg=hexRgb(c);const n=cnt(item.id);
    h+=item.q
      ?`<div class="box-card queue-box" style="border-color:rgba(${rg},0.4)"><div class="queue-label" style="color:${c}">${def.label}</div><div class="queue-count" style="color:${c}">${n}</div></div>`
      :`<div class="box-card" onclick="viewBox('${item.id}')" style="background:rgba(${rg},0.05);border-color:rgba(${rg},0.28)"><div class="box-label" style="color:${c}">${def.label}</div><div class="box-count" style="color:${c}">${n}</div></div>`;

  return h+renderReservePanel(cnt("reserve"),masteredTile)+`</div>`;
}

// ═══════════════════════════════════════════════════════════

let _lastFill=null;
function l1InPlay(b){b=b||getBoxes();return (b.l1||[]).length+(b.l1q||[]).length;}

   +'</svg>'
   +(over?'<div style="position:absolute;right:11px;top:70px;font-size:10px;color:var(--sunL)">+'+(inPlay-target)+'</div>':"");

// Fill order: starred first, then oldest added
function reservePickOrder(){
  const b=getBoxes();const wm={};getWords().forEach(w=>{wm[w.id]=w;});
  return (b.reserve||[]).map((id,i)=>({id,i})).filter(x=>wm[x.id]).sort((a,c)=>{
    const pa=wm[a.id].priority?1:0,pc=wm[c.id].priority?1:0;
    if(pa!==pc)return pc-pa;
    const ta=wm[a.id].createdAt||0,tc=wm[c.id].createdAt||0;
    return ta!==tc?ta-tc:a.i-c.i;
  }).map(x=>x.id);
}
function renderReservePanel(shownCount,extraHtml){
  const b=getBoxes();const def=boxDef("reserve");const c=def.color;const rg=hexRgb(c);

      <button class="btn1" style="width:100%;justify-content:center;padding:11px 10px;font-size:13px" ${total===0||need===0?"disabled":""} onclick="askFillReserve('target')">${fillLabel}</button>

function saveReserveTarget(v){const n=Math.max(1,Math.min(500,parseInt(v)||40));const s=getSettings();s.l1Target=n;saveSettings(s);toast("Target saved");render();}
function askFillReserve(mode){
  const b=getBoxes();const total=(b.reserve||[]).length;const inPlay=l1InPlay(b);const target=getSettings().l1Target||40;
  let n;
  if(mode==="target"){n=Math.min(Math.max(0,target-inPlay),total);}
  else{n=parseInt(document.getElementById("rs-n")?.value);if(!n||n<1){toast("Enter how many to add","var(--sun)");return;}n=Math.min(n,total);}
  if(n<1){toast(total===0?"Reserves is empty":"L1 is already at target","var(--sun)");return;}
  const order=reservePickOrder().slice(0,n);const wm={};getWords().forEach(w=>{wm[w.id]=w;});

    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">

        ${mode==="manual"&&after>target?`<div style="font-size:11px;color:var(--muted2);margin-bottom:6px">This goes ${after-target} over your target.</div>`:""}
        <div style="display:flex;gap:10px;justify-content:center;margin-top:20px">

function doFillReserve(n){
  const ids=reservePickOrder().slice(0,n);if(!ids.length)return;

function undoLastFill(){

function doFlip(){const sess=getSession();if(!sess)return;sess.flipped=true;saveSession(sess);render();}
function rateWord(rating){
  const sess=getSession();if(!sess||!sess.active)return;
  const step=sess.steps[sess.stepIdx];const wordId=sess.queue[sess.queueIdx];
  const dest=rating==="correct"?correctDest(step.box,sess.dow):incorrectDest(step.box);
  removeWordFromBox(wordId,step.box);addWordToBox(wordId,dest);
  sess.ratings[wordId]=rating;sess.moveLog.push({wordId,from:step.box,to:dest});
  if(rating==="correct")step.correct++;else step.incorrect++;
  sess.sessionTotal++;if(rating==="correct")sess.sessionCorrect++;
  if(!sess.byLevel[step.box])sess.byLevel[step.box]={correct:0,total:0};
  sess.byLevel[step.box].total++;if(rating==="correct")sess.byLevel[step.box].correct++;
  sess.queueIdx++;sess.flipped=false;saveSession(sess);render();
}

// STEP FLOW
// ═══════════════════════════════════════════════════════════
function finishStep(){
  const sess=getSession();if(!sess)return;
  sess.steps[sess.stepIdx].done=true;const box=sess.steps[sess.stepIdx].box;
  if(box==="l5b"){
    const f=getBoxes();if((f.l5a||[]).length>0){
      sess.pendingPrompt={type:"move",from:"l5a",to:"l5b",msg:"Move L5A → L5B?",sub:"Words in L5A have waited their week and are ready to become L5B candidates."};
      saveSession(sess);render();return;
    }
  }
  if(box==="l4"){const f=getBoxes();if((f.l4q||[]).length>0){moveWords([...f.l4q],"l4q","l4");toast("L4 Queue → L4 ✓","var(--blue)");}}
  if(box==="l3"){const f=getBoxes();if((f.l3q||[]).length>0){moveWords([...f.l3q],"l3q","l3");toast("L3 Queue → L3 ✓","var(--brand)");}}
  if(box==="l2b"){
    const f=getBoxes();if((f.l2a||[]).length>0){
      sess.pendingPrompt={type:"move",from:"l2a",to:"l2b",msg:"Move L2A → L2B?",sub:"These words have waited 2 days and are ready to be reviewed in tomorrow's L2B session."};
      saveSession(sess);render();return;
    }
  }
  if(box==="l1"){const f=getBoxes();if((f.l1q||[]).length>0){moveWords([...f.l1q],"l1q","l1");}endSession(sess);return;}
  advanceStep(sess);
}
function advanceStep(sess){
  if(!sess)sess=getSession();if(!sess)return;
  sess.stepIdx++;
  if(sess.stepIdx>=sess.steps.length){endSession(sess);return;}
  const nextBox=sess.steps[sess.stepIdx].box;
  sess.queue=[...(getBoxes()[nextBox]||[])];sess.queueIdx=0;sess.flipped=false;
  saveSession(sess);render();
}

function confirmPrompt(yes){

function endSession(sess){
  const stats=getStats();const dow=sess.dow;
  stats.lifetime.reviewed=(stats.lifetime.reviewed||0)+sess.sessionTotal;
  stats.lifetime.correct=(stats.lifetime.correct||0)+sess.sessionCorrect;
  Object.keys(sess.byLevel||{}).forEach(box=>{
    if(!stats.lifetime.byLevel[box])stats.lifetime.byLevel[box]={correct:0,total:0};

  if(stats.sessions.length>300)stats.sessions=stats.sessions.slice(-300);

}
function confirmEndSession(){

// ═══════════════════════════════════════════════════════════
// SUMMARY
// ═══════════════════════════════════════════════════════════
function renderSummary(){
  const sess=getSession();if(!sess)return renderHome();
  const boxes=getBoxes();const settings=getSettings();
  const l1Count=(boxes.l1||[]).length;const l1Target=settings.l1Target||40;const l1Diff=l1Target-l1Count;
  const pct=sess.sessionTotal>0?Math.round(sess.sessionCorrect/sess.sessionTotal*100):0;
  const praise=pct>=90?"¡Excelente!":pct>=70?"¡Muy bien!":"¡Sigue así!";
  const statCols=[{v:sess.sessionTotal,l:"Reviewed",c:"var(--brandL)"},{v:sess.sessionCorrect,l:"Correct",c:"var(--green)"},{v:sess.sessionTotal-sess.sessionCorrect,l:"Missed",c:"var(--red)"},{v:`${pct}%`,l:"Accuracy",c:"var(--brand)"}];
  const byLvlRows=Object.keys(sess.byLevel||{}).map(box=>{
    const d=sess.byLevel[box];const def=boxDef(box);const a=d.total>0?Math.round(d.correct/d.total*100):0;

    </div>`;
  }).join("");
  const l1Tip=l1Diff>0?`<div style="background:rgba(255,138,120,0.07);border:1px solid rgba(255,138,120,0.22);border-radius:11px;padding:16px;margin-top:16px">

    <div style="font-size:12px;color:var(--muted)">L1 has <span style="color:var(--sand)">${l1Count}</span> words. Target is <span style="color:var(--brandL)">${l1Target}</span>. Consider adding <strong${l1Diff}</strong> more.</div>
    <button class="btn2" style="margin-top:10px;font-size:12px;padding:8px 14px" onclick="setView('add')">+ Add Words</button>
  </div>`:`<div style="font-size:12px;color:var(--muted);margin-top:14px">L1 has ${l1Count} words${l1Diff===0?` — exactly at your target of ${l1Target} 🎯`:` (${-l1Diff} above target of ${l1Target})`}.</div>`;
  const stats=getStats();const wCut=Date.now()-7*86400000;const wS=stats.sessions.filter(s=>s.ts>=wCut);

function stripAccents(t){return(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();}
function renderBoxes(){

    const matches=words.filter(w=>stripAccents(w.english).includes(q)||stripAccents(w.arabic).includes(q));

              padding:4px 7px;background:${boxId==="orphan"?"rgba(255,123,138,0.06)":"var(--card2)"};
              color:${def.color};cursor:pointer;font-family:inherit;flex-shrink:0;outline:none">
            ${boxId==="orphan"?`<option value="" disabled selected style="color:var(--muted)">⚠ not in a box</option>`:""}

        ${isRes?`<button class="reserve-star${w.priority?" on":""}" title="Fill first" onclick="toggleReserveStar('${id}')">${w.priority?"★":"☆"}</button>`:""}
        ${delBtn(id)}
      </div>`;}).join("");
  return`${searchBar}<div class="tab-strip">${tabs}</div>
    <div style="margin-bottom:18px"><div style="font-family:var(--serif);font-size:22px;font-weight:700;color:${def.color}">${def.label}</div>

Assumed variant: ${vNote}

Respond ONLY with this exact JSON structure, no markdown:
{"arabic":"base form","english":"meaning","wordType":"Verb or Noun or Adjective or Adverb or Phrase or Other","extraFields":{},"exampleEs":"sentence","exampleEn":"english translation"}`
      :`You are an expert Spanish linguist. Generate a vocabulary flashcard.
English: "${mainInput}"
Variant: ${vNote}
Detect word type automatically.

If Verb: extraFields MUST have exactly these 3 keys with non-empty values: "Infinitivo" (infinitive), "Yo (presente)" (1st person singular present tense), "Participio" (past participle).
If Adjective: extraFields MUST have exactly these 2 keys: "Masculino" (masculine singular), "Femenino" (feminine singular).
Otherwise: extraFields = {}.

Also provide one short natural example sentence in ${vNote}, plus its English translation.

Respond ONLY with this exact JSON, no markdown:
{"arabic":"main Spanish form","english":"${mainInput}","wordType":"Verb or Noun or Adjective or Adverb or Phrase or Other","extraFields":{},"exampleEs":"sentence","exampleEn":"translation"}`;
    try{
      const r=await fetch(apiUrl(),{method:"POST",headers:apiHeaders(),
        body:JSON.stringify({model:"claude-sonnet-4-5-20250929",max_tokens:600,messages:[{role:"user",content:prompt}]})});
      const data=await r.json();const raw2=data.content?.find(c=>c.type==="text")?.text||"";
      const p=JSON.parse(raw2.replace(/```json|```/g,"").trim());
      const ex=p.exampleEs?(p.exampleEn?`${p.exampleEs} — ${p.exampleEn}`:p.exampleEs):"";

  }
  _bulkState={..._bulkState,loading:false,results};render();
}

function exportData(){
  const keys=["pal-words","pal-boxes","pal-settings","pal-stats","pal-session","pal-last-clear"];
  const snapshot={exportedAt:new Date().toISOString(),version:1,app:"palabritas"};
  keys.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)snapshot[k]=JSON.parse(v);});
  const blob=new Blob([JSON.stringify(snapshot,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`palabritas-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast("Backup downloaded ✓");
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){

      if(!snapshot["pal-words"]&&!snapshot["pal-boxes"]){toast("Invalid backup file","var(--red)");return;}
      const dateStr=snapshot.exportedAt?new Date(snapshot.exportedAt).toLocaleDateString("en",{month:"short",day:"numeric",year:"numeric"}):"this file";

function _importConfirmed(){
  const snap=window._pendingImport;if(!snap)return;

// IMPORT WORDS — paste JSON from an external tool; only ADDS cards,
// never touches existing words/boxes/stats/session. Not to be
// confused with "Import Backup", which replaces everything.
// Entry: {es, en, variant?, pos?, example?, forms?{label:value}, added?}
// ═══════════════════════════════════════════════════════════
const IMPORT_WORDS_FORMAT="palabritas-import-v1";
function importKey(t){return(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim().toLowerCase();}
function importVariantLabel(v){const t=(v||"").trim().toLowerCase();return VARIANTS.find(x=>x.toLowerCase()===t)||"Neutral";}
function importPosLabel(p){const t=(p||"").trim().toLowerCase();return WORD_TYPES.find(x=>x.toLowerCase()===t)||"Other";}
function mapImportEntry(raw){
  const es=(raw.es||raw.word||"").trim();const en=(raw.en||"").trim();
  const forms={};
  if(raw.forms&&typeof raw.forms==="object"&&!Array.isArray(raw.forms))Object.entries(raw.forms).forEach(([k,v])=>{if(typeof v==="string"&&v.trim())forms[k]=v.trim();});
  [["plural","Plural"],["feminine","Femenino"],["masculine","Masculino"],["infinitive","Infinitivo"],["participle","Participio"]].forEach(([k,l])=>{if(typeof raw[k]==="string"&&raw[k].trim())forms[l]=raw[k].trim();});
  let createdAt=Date.now();const t=Date.parse((raw.added||"").trim());if(!isNaN(t))createdAt=t;
  return{id:uid(),arabic:es,english:en,example:(raw.example||"").trim(),wordType:importPosLabel(raw.pos),dialect:importVariantLabel(raw.variant),forms,createdAt};
}
let _importWordsState={text:"",error:null,result:null};
function openImportWordsModal(){_importWordsState={text:"",error:null,result:null};renderImportWordsModal();}
function closeImportWordsModal(){closeModal();}
function renderImportWordsModal(){

        <textarea id="import-words-ta" class="bulk-ta" style="min-height:200px;font-size:12px;line-height:1.6" placeholder='{"format":"${IMPORT_WORDS_FORMAT}","words":[{"es":"la casa","en":"the house","variant":"Neutral","pos":"Noun"}]}' oninput="_importWordsState.text=this.value">${taVal}</textarea>
        ${s.error?`<div style="color:var(--red);font-size:12px;margin-top:10px;padding:10px 12px;background:rgba(255,123,138,0.08);border-radius:8px;line-height:1.5">${s.error}</div>`:""}

function renderImportWordsResult(r){
  const dupList=r.duplicates.length?`<details style="margin-top:8px">
    <summary style="cursor:pointer;font-size:11px;color:var(--muted)">Show ${r.duplicates.length} skipped duplicate${r.duplicates.length!==1?"s":""}</summary>
    <div style="margin-top:8px;max-height:160px;overflow-y:auto">${r.duplicates.map(d=>`<div style="font-size:12px;color:var(--muted);padding:5px 0;border-bottom:1px solid var(--border)"><span style="font-family:var(--serif);color:var(--brandL);font-size:15px">${d.es}</span> — ${d.en} <span style="color:var(--muted2)">(${d.variant}, already in your deck)</span></div>`).join("")}</div>
  </details>`:"";
  const invList=r.invalid.length?`<details style="margin-top:8px">
    <summary style="cursor:pointer;font-size:11px;color:var(--muted)">Show ${r.invalid.length} invalid entr${r.invalid.length!==1?"ies":"y"}</summary>
    <div style="margin-top:8px;max-height:160px;overflow-y:auto">${r.invalid.map(x=>`<div style="font-size:12px;color:var(--muted);padding:5px 0;border-bottom:1px solid var(--border)">Entry ${x.index+1}: ${x.reason}</div>`).join("")}</div>
  </details>`:"";
  return`<div style="margin-top:14px;padding:12px 14px;background:rgba(111,214,160,0.07);border:1px solid rgba(111,214,160,0.22);border-radius:10px">
    <div style="font-size:13px;color:var(--sand)">Imported <strong style="color:var(--green)">${r.imported}</strong>, skipped <strong style="color:var(--sun)">${r.duplicates.length}</strong> duplicate${r.duplicates.length!==1?"s":""}, <strong style="color:var(--red)">${r.invalid.length}</strong> invalid.</div>
    ${dupList}${invList}
  </div>`;
}
function runWordImport(){
  const ta=document.getElementById("import-words-ta");
  const raw=ta?ta.value:(_importWordsState.text||"");
  _importWordsState.text=raw;
  const fail=(msg)=>{_importWordsState={..._importWordsState,error:msg,result:null};renderImportWordsModal();};
  let parsed;
  try{parsed=JSON.parse(raw);}
  catch(e){return fail("That isn't valid JSON — check for a missing bracket, quote, or trailing comma.");}
  let list;
  if(Array.isArray(parsed)){list=parsed;}
  else if(parsed&&typeof parsed==="object"&&Array.isArray(parsed.words)){
    if(parsed.format!==IMPORT_WORDS_FORMAT)return fail(`Unrecognized format "${parsed.format||"(none)"}" — expected "${IMPORT_WORDS_FORMAT}".`);
    list=parsed.words;
  }else return fail(`Expected a "words" array (${IMPORT_WORDS_FORMAT}) or a bare array of word objects.`);
  if(!list.length)return fail("No words found in that JSON.");

  // Dedupe against words already in the app, by Spanish (accents stripped) + variant
  const existingWords=getWords();
  const seen=new Set(existingWords.map(w=>importKey(w.arabic)+"|"+w.dialect));
  const toAdd=[];const duplicates=[];const invalid=[];
  list.forEach((entry,i)=>{
    if(!entry||typeof entry!=="object"||Array.isArray(entry)){invalid.push({index:i,reason:"Not a word object"});return;}
    const esRaw=(entry.es||entry.word||"").trim();const enRaw=(entry.en||"").trim();
    if(!esRaw||!enRaw){invalid.push({index:i,reason:!esRaw&&!enRaw?'Missing "es" and "en"':!esRaw?'Missing "es"':'Missing "en"'});return;}
    const word=mapImportEntry(entry);
    const key=importKey(word.arabic)+"|"+word.dialect;
    if(seen.has(key)){duplicates.push({es:word.arabic,en:word.english,variant:word.dialect});return;}
    seen.add(key); // also catches duplicates within this same pasted batch
    toAdd.push(word);
  });

  if(toAdd.length){
    const sess=getSession();const sa=sess&&sess.active;
    const tb=sa?(SESSION_QUEUE_FOR_BOX[sess.steps[sess.stepIdx]?.box||"l1"]||"l1q"):"l1";
    const boxes=getBoxes();if(!boxes[tb])boxes[tb]=[];
    toAdd.forEach(w=>{if(!boxes[tb].includes(w.id))boxes[tb].push(w.id);});
    saveWords([...existingWords,...toAdd]);  // one write for the whole batch
    saveBoxes(boxes);                        // one write for the whole batch
    toast(`Imported ${toAdd.length} word${toAdd.length!==1?"s":""} to ${boxDef(tb).label} ✓`);
  }
  _importWordsState={..._importWordsState,error:null,result:{imported:toAdd.length,duplicates,invalid}};
  renderImportWordsModal();
}

function renderSentenceRow(s,idx){
  const esHtml=s.words.map(w=>{
    if(w.isNew){
      const safeM=w.meaning.replace(/'/g,"&#39;").replace(/"/g,"&quot;");

      return`<span class="w-new" id="${wId}" onclick="showWordPopup('${wId}','${safeM}','${encodeURIComponent(w.token)}')">${w.token}</span>`;
    }
    return`<span class="w-known">${w.token}</span>`;
  }).join(" ");
  return`<div class="sentence-row">
    <div class="sentence-es">${esHtml}</div>
    ${s.en?`<div class="sentence-en">${s.en}</div>`:""}
  </div>`;

function showWordPopup(elId,meaning,encodedToken){
  document.querySelectorAll(".w-popup").forEach(el=>el.remove());
  const trigger=document.getElementById(elId);if(!trigger)return;
  const token=decodeURIComponent(encodedToken);
  const popup=document.createElement("div");
  popup.className="w-popup";
  popup.style.cssText=`position:fixed;z-index:300;background:var(--card);border:1px solid rgba(42,94,168,0.3);border-radius:12px;padding:14px 16px;min-width:200px;max-width:260px;box-shadow:0 8px 32px rgba(0,0,0,.15);text-align:center;`;
  popup.innerHTML=`
    <div style="font-size:20px;font-weight:600;color:var(--brandL);margin-bottom:4px">${token}</div>
    <div style="font-size:14px;color:var(--sand);margin-bottom:12px">${meaning}</div>
    <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">

      <button onclick="addWordFromApply('${encodeURIComponent(token)}','${meaning.replace(/'/g,"&#39;")}','l1q')" style="font-size:11px;padding:5px 10px;border-radius:7px;border:1px solid var(--blue);color:var(--blue);background:rgba(42,94,168,0.08);cursor:pointer;font-family:inherit">+ Add to L1 Queue</button>
    </div>

  const top=rect.top-160>0?rect.top-150:rect.bottom+8;
  popup.style.top=top+"px";
  popup.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-270))+"px";
  document.body.appendChild(popup);
  setTimeout(()=>document.addEventListener("click",function h(e){if(!popup.contains(e.target)&&e.target.id!==elId){popup.remove();document.removeEventListener("click",h);}},true),100);
}

function addWordFromApply(encodedToken,meaning,targetBox){
  const token=decodeURIComponent(encodedToken);
  const existing=getWords().find(w=>w.arabic===token);
  if(existing){
    const boxes=getBoxes();
    const alreadyThere=(boxes[targetBox]||[]).includes(existing.id);
    if(!alreadyThere){
      Object.keys(boxes).forEach(k=>boxes[k]=(boxes[k]||[]).filter(x=>x!==existing.id));
      boxes[targetBox]=[...(boxes[targetBox]||[]),existing.id];
      saveBoxes(boxes);toast(`"${token}" moved to ${boxDef(targetBox).label} ✓`);
    }else{toast(`Already in ${boxDef(targetBox).label}`,"var(--muted)","var(--muted)");}
  }else{
    const word={id:uid(),arabic:token,english:meaning,example:"",wordType:"Other",dialect:_applyState.variant,forms:{},createdAt:Date.now()};
    saveWords([...getWords(),word]);addWordToBox(word.id,targetBox);
    toast(`"${token}" added to ${boxDef(targetBox).label} ✓`);
  }
  document.querySelectorAll(".w-popup").forEach(el=>el.remove());
}

async function generateApply(){
  const masteredIds=(getBoxes().mastered||[]);
  const masteredWords=masteredIds.map(id=>wordById(id)).filter(Boolean);
  const allWords=getWords();
  const wordPool=masteredWords.length>0?masteredWords:allWords;

  const variant=_applyState.variant;

    let entry=w.arabic+" ("+w.english+", "+w.wordType+")";
    if(w.forms&&Object.keys(w.forms).length>0){
      entry+=" ["+Object.entries(w.forms).map(kv=>kv[0]+": "+kv[1]).join(", ")+"]";
    }
    return entry;
  }).join("\n");

  let prompt="";

  if(mode==="reading"){
    prompt=`You are an expert Spanish language teacher specializing in ${vNote}.

The student has mastered these Spanish words:
${wordBank}

Task: Write a natural, flowing paragraph (5–7 sentences) in ${vNote}. The paragraph should:
- Use as many of the mastered words as possible in natural context
- Have a coherent topic (daily life, a story, a scene, etc.)
- Be at a slightly challenging but readable level
- Feel authentic to the variant, not like a textbook

Then return a word-by-word analysis so new words can be highlighted.

CRITICAL: Respond ONLY with valid JSON, no markdown:
{
  "sentences": [
    {
      "ar": "full Spanish sentence",
      "en": "English translation",
      "words": [
        {"token": "each Spanish word exactly as it appears", "meaning": "English meaning", "isNew": true or false}
      ]
    }
  ]
}

For "isNew": mark false if the word (or its base form) is in the mastered list OR is a basic function word (el, la, los, las, de, que, y, en, a, por, con, se, no, es, son, etc.). Mark true only for genuinely new vocabulary.`;
  } else {
    const focus=GRAMMAR_FOCUSES.find(f=>f.id===_applyState.grammarFocus)||GRAMMAR_FOCUSES[0];
    const structureInstructions={
      "presente":"Write 6 sentences in the present indicative tense (presente de indicativo). Vary subjects: yo, tú, él/ella, nosotros, vosotros/ustedes, ellos/ellas. Include both regular and common irregular verbs.",
      "preterito":"Write 6 sentences in the simple past (pretérito indefinido). Show regular -ar/-er/-ir conjugation patterns AND common irregulars (ser/ir, tener, hacer, decir, poder, etc.). Vary subjects and contexts.",
      "imperfecto":"Write 6 sentences in the imperfect past (pretérito imperfecto). Emphasize habitual past actions, descriptions, background context, and states. Contrast with preterite meaning where natural.",
      "futuro":"Write 6 sentences in the simple future (futuro simple). Include both regular forms AND common irregulars (tener→tendrá, hacer→hará, poder→podrá, decir→dirá, etc.). Vary subjects.",
      "condicional":"Write 6 sentences in the conditional (condicional simple). Show hypothetical situations. Include common irregulars. Mix with si clauses (Si tuviera..., Haría...) where natural.",
      "subjuntivo":"Write 6 sentences using the present subjunctive (subjuntivo presente). Use triggers: verbs of desire/emotion/doubt (quiero que, espero que, me alegra que), impersonal expressions (es importante que). Show stem-change patterns.",
      "imperativo":"Write 6 imperative sentences (imperativo). Mix positive and negative commands. Vary forms: tú affirmative (habla), tú negative (no hables), usted (hable/no hable), ustedes (hablen), nosotros (hablemos).",
      "ser-estar":"Write 6 sentences requiring careful distinction between ser and estar. Ser: identity, origin, profession, material, time. Estar: location, current state, emotion, ongoing condition, result of change. Make the contrast clear.",
      "por-para":"Write 6 sentences illustrating por vs. para. Por: cause/reason, exchange, duration, movement through, on behalf of. Para: purpose/goal, destination, deadline, recipient, in order to.",
      "reflexivos":"Write 6 sentences with reflexive verbs (verbos reflexivos). Include common ones: levantarse, llamarse, sentirse, ponerse, irse, acostarse, ducharse. Vary tenses and subjects.",
      "perfecto":"Write 6 sentences in the present perfect (pretérito perfecto: haber + participio). Show regular participios (-ado/-ido) AND irregulars (hecho, visto, dicho, puesto, escrito, vuelto, roto, abierto).",
      "progresivo":"Write 6 sentences using the gerund (gerundio) in progressive constructions (estar + -ando/-iendo). Also show: seguir + gerundio, llevar + gerundio, ir + gerundio. Include gerunds of irregular stems.",
      "negacion":"Write 6 sentences demonstrating Spanish negation patterns. Include: no + verb, nunca (never), nada (nothing), nadie (nobody), ningún/ninguno (none), ni...ni (neither...nor), tampoco (neither/also not). Show double negation (no...nunca).",
      "comparativo":"Write 6 sentences using comparative and superlative. Include: más/menos...que, tan...como, tanto/tanta...como, el/la más...de, el/la menos...de. Include irregular forms: mejor/peor, mayor/menor.",
      "relativas":"Write 6 sentences using relative clauses. Use: que (most common), quien/quienes (with prepositions, referring to people), donde (place), lo que (what/that which), el/la cual. Include both restrictive and non-restrictive clauses.",
      "concordancia":"Write 6 sentences demonstrating gender and number agreement between articles, nouns, and adjectives. Show masculine/feminine pairs, plural agreement, irregular gender nouns, and adjectives that change form.",
    }[focus.id]||"Write 6 varied sentences demonstrating this grammar concept clearly.";

    prompt=`You are an expert Spanish language teacher specializing in ${vNote}.

The student has mastered these Spanish words:
${wordBank}

Grammar focus: ${focus.label} — ${focus.desc}

Task: ${structureInstructions}

Use mastered vocabulary where natural. Add other vocabulary freely as needed. Keep sentences natural for ${vNote} — not textbook stiff.

Start with a 1–2 sentence plain-English explanation of the grammatical concept and what to notice in the sentences.

CRITICAL: Respond ONLY with valid JSON, no markdown:
{
  "explanation": "Brief English explanation of the grammar concept and what to watch for",
  "sentences": [
    {
      "ar": "Spanish sentence",
      "en": "English translation",
      "words": [
        {"token": "each Spanish word as it appears", "meaning": "English meaning", "isNew": true or false}
      ]
    }
  ]
}

For "isNew": false = in mastered list OR basic function word (el, la, de, que, y, en, a, se, no, es, son, etc.). true = genuinely new vocabulary the student hasn't seen.`;
  }

  try{
    const resp=await fetch(apiUrl(),{
      method:"POST",headers:apiHeaders(),
      body:JSON.stringify({
        model:"claude-sonnet-4-5-20250929",max_tokens:4000,
        system:"You are an expert Spanish language teacher. Always respond with valid JSON only — no markdown fences, no explanation outside the JSON, no preamble.",
        messages:[{role:"user",content:prompt}]
      })
    });
    const data=await resp.json();
    if(data.error){_applyState={..._applyState,loading:false,error:`API error (${data.error.type}): ${data.error.message}`};render();return;}
    const raw=data.content?.find(c=>c.type==="text")?.text||"";
    if(!raw){_applyState={..._applyState,loading:false,error:`Empty response from API. Full: ${JSON.stringify(data).slice(0,200)}`};render();return;}
    const jsonMatch=raw.match(/\{[\s\S]*\}/);
    if(!jsonMatch){_applyState={..._applyState,loading:false,error:`No JSON found in response: ${raw.slice(0,200)}`};render();return;}
    let parsed;
    try{parsed=JSON.parse(jsonMatch[0]);}
    catch(je){_applyState={..._applyState,loading:false,error:`JSON parse error: ${je.message}`};render();return;}
    _applyState={..._applyState,loading:false,result:parsed};
  }catch(e){
    _applyState={..._applyState,loading:false,error:`Fetch failed: ${e.message||String(e)}`};
  }
  render();
}

// ═══════════════════════════════════════════════════════════
// API / CLOUDFLARE / BOOT
// ═══════════════════════════════════════════════════════════
function insideClaude(){return window.location.hostname.includes("claude.ai");}
function apiUrl(){
  if(insideClaude())return"https://api.anthropic.com/v1/messages";
  return WORKER_URL;
}
function apiHeaders(){
  const h={"Content-Type":"application/json"};
  if(insideClaude()){
    h["anthropic-dangerous-direct-browser-access"]="true";
  }else{
    const k=getApiKey();if(k)h["X-Api-Key"]=k;
  }
  return h;
}

// ── Cloudflare + PIN setup screen ──
function renderSetup(){
  const existingKey=getApiKey();
  document.getElementById("main").innerHTML=`
    <div style="max-width:480px;margin:0 auto;padding-top:20px">
      <div style="font-family:'Dancing Script',cursive;font-size:48px;text-align:center;color:var(--brandL);margin-bottom:6px">🌺 Palabritas</div>
      <div style="text-align:center;font-size:11px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-bottom:30px">tu vocabulario</div>
      <div class="card">
        ${sHead("Welcome")}
        <div style="font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:22px">
          Choose a numeric PIN to identify your data. Use the same PIN on any device to access your words.
        </div>
        <div class="field">
          <label class="lbl">Your PIN <span style="color:var(--muted2);font-size:10px">(4–8 digits, you choose)</span></label>
          <input id="setup-pin" class="inp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="8"
            placeholder="e.g. 482910" style="font-size:22px;letter-spacing:.25em;max-width:200px;font-weight:600;color:var(--brandL)"/>
        </div>
        <div class="field">
          <label class="lbl">Anthropic API Key <span style="color:var(--muted2);font-size:10px">(for Quick/Bulk Add and Apply)</span></label>
          <input id="setup-key" class="inp" type="password" placeholder="sk-ant-api03-…" style="font-size:13px" value="${existingKey}"/>
          <div style="font-size:10px;color:var(--muted2);margin-top:5px">Optional — without this, only flashcard review works.</div>
        </div>
        <button class="btn1" onclick="checkConnectionAndBoot()" style="width:100%;justify-content:center;padding:14px">
          ✓ Verify Cloudflare Connection
        </button>
        <div id="setup-result" style="margin-top:14px;font-size:12px;line-height:1.6"></div>
      </div>
    </div>`;
}

async function checkConnectionAndBoot(){
  const pinInput=(document.getElementById("setup-pin")?.value||"").trim();
  const keyInput=(document.getElementById("setup-key")?.value||"").trim();
  const el=document.getElementById("setup-result");
  if(!pinInput||pinInput.length<4||!/^\d+$/.test(pinInput)){
    el.style.color="var(--red)";el.textContent="PIN must be at least 4 numeric digits.";return;
  }
  el.style.color="var(--muted)";el.textContent="Checking Cloudflare connection…";
  try{
    const r=await fetch(WORKER_URL,{method:"POST",
      headers:{"Content-Type":"application/json","X-Action":"kv-get"},
      body:JSON.stringify({key:pinInput+"-pal-ping"})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    savePin(pinInput);_pin=pinInput;
    if(keyInput)saveApiKey(keyInput);
    el.style.color="var(--green)";el.textContent="✓ Connected! Loading your data…";
    try{
      const data=await kvGetAll(pinInput);
      Object.entries(data).forEach(([k,v])=>{
        localStorage.setItem(k,typeof v==="string"?v:JSON.stringify(v));
      });
    }catch(e){/* start fresh if no prior data */}
    setTimeout(()=>bootApp(),700);
  }catch(e){
    el.style.color="var(--red)";
    el.textContent=`✗ Could not connect: ${e.message}. Check your internet connection.`;
  }
}

async function forceSyncKV(){
  if(!_pin){toast("No PIN configured","var(--red)");return;}
  toast("Syncing…","var(--muted)");
  try{
    const data=await kvGetAll(_pin);
    Object.entries(data).forEach(([k,v])=>{
      localStorage.setItem(k,typeof v==="string"?v:JSON.stringify(v));
    });
    render();toast("Sync complete ✓");
  }catch(e){toast("Sync failed","var(--red)");}
}

function bootApp(){
  runMidnightClear();
  const sess=getSession();
  if(sess&&sess.active)_view="review";
  render();
  // Background KV sync — refresh data silently on load
  if(_pin&&!insideClaude()){
    kvGetAll(_pin).then(data=>{
      let changed=false;
      Object.entries(data).forEach(([k,v])=>{
        const cur=localStorage.getItem(k);
        const fresh=typeof v==="string"?v:JSON.stringify(v);
        if(cur!==fresh){localStorage.setItem(k,fresh);changed=true;}
      });
      if(changed)render();
    }).catch(()=>{/* use local data */});
  }
}

(function init(){
  if(insideClaude()){bootApp();return;}
  const pin=getPin();
  if(pin){_pin=pin;bootApp();return;}
  runMidnightClear();renderSetup();
})();
</script>
